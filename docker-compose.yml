version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: worksphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-worksphere}
      POSTGRES_USER: ${DATABASE_USER:-worksphere_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-devpassword}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-worksphere_user} -d ${DATABASE_NAME:-worksphere}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - worksphere-network

  # ============================================
  # Redis Cache & Queue
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: worksphere-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpassword} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - worksphere-network

  # ============================================
  # Node.js Express API
  # ============================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: worksphere-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-worksphere}
      DATABASE_USER: ${DATABASE_USER:-worksphere_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-devpassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      PYTHON_SERVICE_URL: http://python-service:8000
      ANALYTICS_SERVICE_API_KEY: ${ANALYTICS_SERVICE_API_KEY:-dev-analytics-key}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src:ro
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - worksphere-network

  # ============================================
  # BullMQ Worker
  # ============================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: worksphere-worker
    restart: unless-stopped
    command: ["node", "dist/jobs/scheduler.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-worksphere}
      DATABASE_USER: ${DATABASE_USER:-worksphere_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-devpassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      PYTHON_SERVICE_URL: http://python-service:8000
      ANALYTICS_SERVICE_API_KEY: ${ANALYTICS_SERVICE_API_KEY:-dev-analytics-key}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - worksphere-network

  # ============================================
  # Python FastAPI Analytics Service
  # ============================================
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: worksphere-python
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DATABASE_USER:-worksphere_user}:${DATABASE_PASSWORD:-devpassword}@postgres:5432/${DATABASE_NAME:-worksphere}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
      API_KEY: ${ANALYTICS_SERVICE_API_KEY:-dev-analytics-key}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - worksphere-network

  # ============================================
  # Next.js Frontend
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: worksphere-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_WS_URL: ${WS_URL:-http://localhost:4000}
      NEXT_PUBLIC_PYTHON_API_URL: ${PYTHON_SERVICE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      - api
    networks:
      - worksphere-network

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: worksphere-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api
      - python-service
    networks:
      - worksphere-network

  # ============================================
  # MailHog (Development Email)
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: worksphere-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - worksphere-network
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  upload_data:
    driver: local

networks:
  worksphere-network:
    driver: bridge
    name: worksphere-network
